<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071126"><title>OPIc AL Set Master V4</title><style>
:root{--bg:#071126;--panel:#0e1936;--panel2:#111f42;--line:#263a69;--text:#f3f7ff;--muted:#aebbd8;--blue:#35bdf6;--good:#5ee6a8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#071126,#0b1430);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:1120px;margin:auto;padding:18px}.head{padding:10px 0 14px}.head h1{margin:0;font-size:30px}.head p{color:var(--muted);margin:8px 0}.nav{display:flex;gap:8px;overflow:auto;padding:8px 0 14px;position:sticky;top:0;background:rgba(7,17,38,.96);z-index:5}.nav button,.btn{border:1px solid var(--line);background:#101b39;color:var(--text);border-radius:14px;padding:12px 16px;font-size:15px;font-weight:700}.nav button.on,.btn.primary{background:#164d6a;border-color:#267ea8}.panel{background:rgba(14,25,54,.96);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:320px 1fr;gap:14px}label{display:block;color:var(--muted);font-size:13px;margin:10px 0 6px}select,input{width:100%;background:#0b1530;color:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px}.setchips{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}.setchips button{padding:9px;border-radius:10px;border:1px solid var(--line);background:#0b1530;color:#fff}.setchips button.on{background:#1b5270}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#173555;color:#bfeaff;font-size:12px;margin-right:6px}.q{font-size:21px;font-weight:800;line-height:1.45;margin:12px 0}.a{font-size:16px;line-height:1.75;color:#edf4ff}.ko{font-size:15px;line-height:1.72;color:#d4def4}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1}.hidden{display:none!important}.progress{height:8px;background:#0b1530;border-radius:99px;overflow:hidden;margin:10px 0}.progress>div{height:100%;background:var(--good);width:33%}.vocabList{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.vcard{background:#0b1530;border:1px solid var(--line);border-radius:13px;padding:12px}.vexp{font-weight:800;color:#dff7ff}.vmean{margin-top:5px}.vex{color:var(--muted);font-size:13px;margin-top:7px}.mini{font-size:13px;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr}.controls{grid-template-columns:repeat(2,1fr)}.vocabList{grid-template-columns:1fr}.wrap{padding:12px}.head h1{font-size:25px}}
.qchips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.qchips button{padding:10px 6px}.qchips button.on{background:#174666;border-color:#287aa5}</style></head><body><div class="wrap"><header class="head"><h1>OPIc AL Set Master V3</h1><p>10개 주제 · 주제당 10세트 × 3문항 = 30문항 · Q1 묘사 → Q2 과거경험 → Q3 문제·해결 · AL 어휘 2,000</p></header><div class="nav"><button class="on" data-page="set">🎯 실전 세트 연습</button><button data-page="single">🎧 개별 스크립트</button><button data-page="vocab">📚 AL 어휘 2,000</button><button data-page="fav">⭐ 즐겨찾기</button></div>
<section id="setPage"><div class="callout"><b>실전 세트 구조:</b> SET 하나에 <b>Q1 현재·일반 묘사 → Q2 과거 경험·비교/변화 → Q3 문제 발생·해결</b>이 들어 있습니다. SET 1~10 = 주제당 총 30문항입니다.</div><div class="grid"><aside class="panel"><label>주제</label><select id="cat"></select><label>SET <span class="mini">(각 SET = 3문항, 주제당 총 30문항)</span></label><div class="setchips" id="setchips"></div><label>SET 안의 3문항 <span class="mini">(원하는 유형을 바로 누르세요)</span></label><div class="qchips" id="qchips"><button data-q="1">Q1 현재·일반 묘사</button><button data-q="2">Q2 과거 경험·비교/변화</button><button data-q="3">Q3 문제 발생·해결</button></div><div class="progress"><div id="prog"></div></div><div class="mini" id="setdesc"></div><label>영어 음성</label><select id="voice"></select><label>음성 속도 <span id="rateLabel">0.90x</span></label><input id="rate" type="range" min="0.7" max="1.15" step="0.05" value="0.9"><div class="row" style="margin-top:12px"><button class="btn" id="prevQ">← 이전</button><button class="btn" id="nextQ">다음 →</button></div></aside><main class="panel"><div><span class="badge" id="setBadge"></span><span class="badge" id="roleBadge"></span></div><div class="q" id="question"></div><div class="controls"><button class="btn primary" id="playQ">▶ 질문</button><button class="btn primary" id="playA">▶ 답변</button><button class="btn" id="stop">■ 정지</button><button class="btn" id="favBtn">☆ 즐겨찾기</button></div><h3>AL Sample Answer</h3><div class="a" id="answer"></div><h3>한국어 해석</h3><div class="ko" id="korean"></div></main></div></section>
<section id="singlePage" class="hidden"><div class="panel"><label>문항 검색</label><input id="search" placeholder="주제, 제목, 질문 검색"><div id="singleList" class="vocabList" style="margin-top:12px"></div></div></section>

<section id="favPage" class="hidden"><div class="panel"><div id="favList" class="vocabList"></div></div></section></div><script>
const DATA=[{"category": "돌발·롤플레이", "num": 1, "title": "Unexpected schedule change", "question": "You were supposed to meet your friend today, but something unexpected came up. Call your friend, explain the situation, and suggest alternatives.", "answer": "Hey, John. It's me. I'm really sorry to do this at the last minute, but something unexpected just came up and I don't think I'm going to be able to make it today. My manager called and asked me to handle something urgent because one of my coworkers called in sick. I know we've been planning this for a while, so I feel terrible. How about tomorrow after six? If that doesn't work, I'm free Saturday. And if I finish early tonight, I'll call you and maybe we can grab a late dinner. Let me know what works best for you.", "ko": "오늘 친구를 만나기로 했지만 회사에 급한 일이 생겨 취소해야 하는 상황입니다. 갑작스러운 변경을 사과하고, 내일 저녁·토요일·오늘 늦은 저녁이라는 여러 대안을 제시합니다.", "set": 1, "q": 1, "role": "정보·상황 파악"}, {"category": "돌발·롤플레이", "num": 2, "title": "Wrong restaurant order", "question": "You received the wrong dish at a restaurant. Explain the problem and ask for a solution.", "answer": "Excuse me. Sorry to bother you, but I think there might have been a mix-up with my order. I ordered the grilled chicken salad, but this looks like the pasta. Normally I wouldn't mind waiting, but I have an appointment in about forty minutes. Would it be possible to replace this with the salad I originally ordered? And could you ask the kitchen to prepare it as quickly as possible? I also asked for the dressing on the side. I understand mistakes happen, so it's not a big deal. I'd really appreciate your help.", "ko": "식당에서 주문과 다른 음식이 나온 상황입니다. 주문 착오를 정중히 설명하고, 원래 음식으로 교체하고 빠르게 준비해 달라고 요청합니다.", "set": 1, "q": 2, "role": "문제 해결·요청"}, {"category": "돌발·롤플레이", "num": 3, "title": "Hotel air conditioner", "question": "There is a problem with the air conditioner in your hotel room. Call the front desk and ask for help.", "answer": "Hi, I'm calling from room 807. I'm having a problem with the air conditioner. It seems to be running, but it isn't cooling the room. I tried changing the temperature and turning it off and back on, but nothing worked. The room is getting pretty warm and I'm having trouble sleeping. Could someone come up and take a look at it? If it can't be fixed tonight, would it be possible to move me to another room? I don't care about the view or the floor. I just need a room where the air conditioning works properly.", "ko": "호텔 객실 에어컨이 작동하지 않는 상황입니다. 직접 시도한 해결 방법을 설명하고, 직원 점검 또는 객실 변경을 요청합니다.", "set": 1, "q": 3, "role": "관련 과거 경험"}, {"category": "돌발·롤플레이", "num": 4, "title": "Defective headphones", "question": "You bought wireless headphones, but one side does not work. Call the store and ask about an exchange or refund.", "answer": "Hi, I'm calling about a pair of wireless headphones I bought yesterday. The left side works fine, but there's no sound from the right side. I first thought it was my phone, so I connected them to my laptop, but I had the same problem. I also reset them according to the instructions, but that didn't help. I still have the receipt and the original packaging. Would it be possible to exchange them for a new pair? If not, I'd like to get a refund. Could you tell me what I need to bring to the store?", "ko": "구입한 무선 이어폰 한쪽이 작동하지 않습니다. 여러 기기와 초기화를 시도했음을 말하고 교환 또는 환불 절차를 문의합니다.", "set": 2, "q": 1, "role": "정보·상황 파악"}, {"category": "돌발·롤플레이", "num": 5, "title": "Broken borrowed item", "question": "You accidentally broke something you borrowed from a friend. Call your friend, explain what happened, and offer a solution.", "answer": "Hey, I need to tell you something. Remember the headphones you lent me? I accidentally dropped them this morning when I got out of my car. I forgot they were sitting on my lap, and they fell straight onto the ground. At first they looked okay, but later I realized the left side wasn't working. I feel terrible because you were nice enough to lend them to me. I'll pay for the repair, and if they can't be fixed, I'll buy you a new pair. This was completely my mistake, so I'll take care of it. I'm really sorry.", "ko": "친구에게 빌린 이어폰을 실수로 떨어뜨려 고장 낸 상황입니다. 구체적으로 사고 경위를 설명하고 수리비 또는 새 제품 구매를 약속합니다.", "set": 2, "q": 2, "role": "문제 해결·요청"}, {"category": "돌발·롤플레이", "num": 6, "title": "Lost phone at cafe", "question": "You lost your cell phone at a cafe. Call the cafe and ask questions to find out if they have it.", "answer": "Hi, I was at your cafe earlier today and I think I may have left my phone there. I was sitting near the window on the second floor from around two to three thirty. It's a black smartphone with a clear case and a small sticker on the back. Has anyone turned in a phone today? If so, could you check whether it matches that description? I may have left it on the table or the chair next to me. If you have it, what time do you close? And do I need to bring ID when I pick it up?", "ko": "카페에 휴대전화를 두고 온 것 같아 전화한 상황입니다. 위치와 외형을 설명하고 습득 여부, 영업시간, 수령 시 신분증 필요 여부를 묻습니다.", "set": 2, "q": 3, "role": "관련 과거 경험"}, {"category": "돌발·롤플레이", "num": 7, "title": "Internet outage", "question": "Your Internet suddenly stopped working. Call your service provider, describe the problem, and ask for assistance.", "answer": "Hi, my Internet suddenly stopped working about an hour ago. Everything was fine this morning, but now none of my devices can connect. I've already restarted the modem and router and unplugged them for a minute, but that didn't solve it. My phone, laptop, and TV are all having the same issue. Could you check if there's an outage in my area? If not, could you walk me through anything else I can try? I have an important video meeting tomorrow morning, so I really need this fixed as soon as possible. If necessary, could you send a technician?", "ko": "인터넷이 갑자기 끊긴 상황입니다. 모뎀·공유기 재부팅 등 이미 시도한 조치를 말하고 지역 장애 여부, 추가 해결 방법, 기사 방문을 요청합니다.", "set": 3, "q": 1, "role": "정보·상황 파악"}, {"category": "돌발·롤플레이", "num": 8, "title": "Change reservation", "question": "You made a reservation, but you need to change it. Call the business and ask about other available times.", "answer": "Hi, I'm calling about a reservation under the name John Kim for this Friday at seven. One of my friends has to work late, so I was wondering if we could push it back. Do you have anything around eight or eight thirty for four people? If not, nine would also work. Would changing the reservation affect the deposit I already paid? Is there any fee for changing the time? If Friday is completely booked, I could also move it to Saturday. What do you have available Saturday evening?", "ko": "금요일 7시 예약을 늦춰야 하는 상황입니다. 8시~9시 대체 시간, 보증금·변경 수수료, 토요일 가능 여부를 문의합니다.", "set": 3, "q": 2, "role": "문제 해결·요청"}, {"category": "돌발·롤플레이", "num": 9, "title": "Missed flight", "question": "You missed your flight. Talk to an airline employee, explain what happened, and ask about your options.", "answer": "Hi. I'm afraid I just missed my flight to New York. There was a major accident on the highway and traffic was completely backed up. I left home much earlier than usual, but it still took almost three hours to get here. I realize this isn't the airline's fault, but I'm wondering what my options are. Is there another flight later today? How much would it cost to change my ticket? I need to arrive by tomorrow morning, so I'd also be willing to take a connecting flight. What would you recommend?", "ko": "교통사고로 도로가 막혀 항공편을 놓친 상황입니다. 오늘 다른 항공편, 변경 비용, 경유편 가능성 등 대안을 문의합니다.", "set": 3, "q": 3, "role": "관련 과거 경험"}, {"category": "돌발·롤플레이", "num": 10, "title": "Concert ticket issue", "question": "Your concert tickets are not showing up in your account. Call customer service and ask for help.", "answer": "Hi, I'm calling about two concert tickets I purchased online yesterday. I received the confirmation email and my card was charged, but the tickets aren't showing up in my account. I've logged out and back in and checked both the website and app, but they're still missing. The concert is this Saturday, so I'm getting worried. Could you check whether my purchase went through correctly? I have the confirmation number here. If there was a technical problem, could you resend the tickets to my email?", "ko": "결제와 확인 메일은 정상인데 콘서트 티켓이 계정에 보이지 않습니다. 구매 내역 확인과 티켓 재전송을 요청합니다.", "set": 4, "q": 1, "role": "정보·상황 파악"}, {"category": "돌발·롤플레이", "num": 11, "title": "Recycling problem", "question": "Tell me about recycling in your country and a problem related to it.", "answer": "Recycling is a pretty big deal where I live. In Korea, people separate plastic, glass, cans, paper, food waste, and general trash. Once you get used to it, it becomes second nature. In my apartment building, there's a designated recycling area, so I usually collect recyclables for a few days and take everything down at once. One issue, though, is that people aren't always sure what can actually be recycled. For example, some people throw food-stained containers into the recycling bin without washing them. I think clearer instructions would make the system much more effective.", "ko": "한국의 분리배출 방식과 일상적인 재활용 습관을 설명하고, 오염된 용기나 품목 구분의 혼란을 문제점으로 제시합니다.", "set": 4, "q": 2, "role": "문제 해결·요청"}, {"category": "돌발·롤플레이", "num": 12, "title": "Weather change", "question": "How has the weather in your country changed over the years?", "answer": "The weather feels quite different from when I was younger. Back then, the four seasons in Korea seemed much more distinct, and spring and fall lasted longer. These days, summer seems to start earlier and the heat is much more intense. Another thing I've noticed is that the weather has become less predictable. We sometimes get unusually warm days in winter, followed by freezing temperatures just a few days later. I'm not a weather expert, of course, but from my own experience, the seasons definitely feel less stable than they used to.", "ko": "어릴 때보다 사계절의 구분이 약해지고 여름이 길고 더워졌으며, 겨울에도 급격한 기온 변화가 나타난다고 설명합니다.", "set": 4, "q": 3, "role": "관련 과거 경험"}, {"category": "돌발·롤플레이", "num": 13, "title": "Subway delay", "question": "Tell me about a memorable problem you experienced while using public transportation.", "answer": "About a year ago, I was taking the subway to meet some friends. The trip normally takes forty minutes, so I left with plenty of time. Everything was fine until the train suddenly stopped between two stations. An announcement said there was a technical problem. I thought it would take only a few minutes, but we sat there for almost thirty. To make matters worse, there was barely any cell reception, so I couldn't properly contact my friends. I arrived almost forty minutes late. Since then, I leave a little earlier whenever I have an important appointment.", "ko": "지하철이 역 사이에서 고장으로 멈추어 약 30분 지연되고 연락도 어려웠던 경험을 말합니다. 이후 중요한 약속에는 더 일찍 출발하게 되었다고 마무리합니다.", "set": 5, "q": 1, "role": "정보·상황 파악"}, {"category": "돌발·롤플레이", "num": 14, "title": "Banking changes", "question": "How have banking services changed compared to the past?", "answer": "Banking has changed dramatically because of smartphones. In the past, people had to visit a branch for things like transfers, account services, and bill payments. You had to take a number and wait for your turn. These days, I hardly ever go to a bank because I can do almost everything on an app. What I like most is the convenience. Sending money takes less than a minute. On the other hand, some older people find mobile banking difficult, so I think traditional branches are still necessary for certain customers.", "ko": "과거 은행 지점을 직접 방문하던 방식과 현재 모바일 뱅킹을 비교하고, 편리함과 고령층의 접근성 문제를 함께 설명합니다.", "set": 5, "q": 2, "role": "문제 해결·요청"}, {"category": "돌발·롤플레이", "num": 15, "title": "Smartphone died", "question": "Tell me about a time when you had a problem with your smartphone.", "answer": "One time, my phone died at probably the worst possible moment. I was on my way to meet a friend in an unfamiliar area and was using a navigation app. My battery suddenly dropped from around ten percent to zero, and the screen went black. The worst part was that I didn't remember the name of the restaurant because everything was saved on my phone. Luckily, there was a convenience store nearby, so I bought a portable charger. After ten minutes, I got the phone back on and contacted my friend. Ever since then, I always carry a small charger.", "ko": "낯선 지역에서 길을 찾던 중 휴대전화가 꺼져 곤란했던 경험입니다. 편의점에서 보조배터리를 사서 해결하고 이후 항상 챙긴다고 말합니다.", "set": 5, "q": 3, "role": "관련 과거 경험"}, {"category": "돌발·롤플레이", "num": 16, "title": "Movie theater inquiry", "question": "You are planning to go to a movie theater with your friend. Call the theater and ask about the movie, ticket prices, seats, and parking.", "answer": "Hi, I'm planning to see a movie at your theater this Saturday and I have a few questions. What time does the movie start in the evening? I'm hoping for around seven or eight. How much is a regular adult ticket, and do you offer any online discounts? Also, are there still two seats together near the middle of the theater? Finally, is parking available, and do moviegoers get free or discounted parking? Thanks. That helps a lot.", "ko": "토요일 저녁 영화 관람을 위해 상영시간, 성인 요금, 온라인 할인, 붙어 있는 좌석, 주차 혜택을 문의합니다.", "set": 6, "q": 1, "role": "정보·상황 파악"}, {"category": "돌발·롤플레이", "num": 17, "title": "Hiking weather change", "question": "The weather forecast changed before a hiking trip. Call your friend and suggest alternatives.", "answer": "Hey, I just checked tomorrow's forecast and there may be a problem with our hiking plan. There's a high chance of heavy rain in the morning. I was really looking forward to it, but a wet trail could be slippery and unsafe. How about we postpone it until next weekend? If you still want to meet tomorrow, we could do something indoors, like going to a cafe, seeing a movie, or trying an indoor climbing gym. I'm fine with anything. Let me know what works for you.", "ko": "등산 전날 폭우 예보를 확인한 상황입니다. 안전 문제를 설명하고 다음 주말로 연기하거나 실내 활동을 제안합니다.", "set": 6, "q": 2, "role": "문제 해결·요청"}, {"category": "돌발·롤플레이", "num": 18, "title": "Broken gym machine", "question": "A machine at your gym is broken. Talk to an employee and ask what you can do.", "answer": "Excuse me. I think there's a problem with the treadmill near the window. I was using it when the screen suddenly went blank. I pressed the power button a few times, but nothing happened, so I stopped because I thought it might be unsafe. Could you take a look at it? Do you know how long repairs usually take? If it can't be fixed today, is there another treadmill you'd recommend? And could you put a sign on it so nobody else tries to use it?", "ko": "헬스장 러닝머신 화면이 꺼져 사용을 중단한 상황입니다. 점검과 수리 시간, 대체 기구를 묻고 다른 이용자를 위한 고장 표시도 요청합니다.", "set": 6, "q": 3, "role": "관련 과거 경험"}, {"category": "돌발·롤플레이", "num": 19, "title": "Late package", "question": "Your online package has not arrived. Call customer service and ask about the delay.", "answer": "Hi, I'm calling about an order I placed last week. It was supposed to arrive yesterday, but I still haven't received it, and the tracking page hasn't updated for almost two days. Could you check where it is and why it's delayed? I need the package by Friday because it's a birthday gift. If it doesn't arrive by then, could you send a replacement by express delivery? And if the package was lost, would I be eligible for a full refund? I'd really appreciate it if you could look into this.", "ko": "온라인 주문 상품이 지연되고 조회 정보도 멈춘 상황입니다. 현재 위치와 지연 이유, 빠른 재배송, 분실 시 환불을 문의합니다.", "set": 7, "q": 1, "role": "정보·상황 파악"}, {"category": "돌발·롤플레이", "num": 20, "title": "Rental car warning light", "question": "You notice a warning light shortly after renting a car. Call the rental company and explain the problem.", "answer": "Hi, I rented a car from your downtown location about thirty minutes ago, and a warning light is still on. I thought it might disappear after driving for a few minutes, but it didn't. I'm not sure what it means, so I don't feel comfortable driving any farther. I'm parked at a gas station about five kilometers from your office. Should I bring the car back, or can someone check it here? If it needs to be replaced, will there be an additional charge? I also need another vehicle this afternoon if possible.", "ko": "렌터카를 받은 직후 경고등이 켜져 불안한 상황입니다. 반납 또는 현장 점검, 교체 비용, 대체 차량 여부를 묻습니다.", "set": 7, "q": 2, "role": "문제 해결·요청"}, {"category": "돌발·롤플레이", "num": 21, "title": "Miss birthday party", "question": "You suddenly become busy and cannot attend a friend's birthday party. Call, apologize, and suggest another plan.", "answer": "Hey, happy birthday again. I have some bad news. I'm really sorry, but I don't think I'll make it to your party tonight. Something urgent came up at work and my manager asked me to stay late. I tried to finish quickly, but I'll probably be here for a few more hours. I feel especially bad because I already said I'd be there. How about I take you out for dinner this weekend? My treat. I'll bring your birthday present then too. I'm sorry I can't celebrate with you tonight, and I hope you have an amazing time.", "ko": "회사 급한 일로 생일파티에 못 가게 된 상황입니다. 미안함을 전하고 주말에 저녁을 사겠다고 대안을 제시합니다.", "set": 7, "q": 3, "role": "관련 과거 경험"}, {"category": "돌발·롤플레이", "num": 22, "title": "Crowded restaurant", "question": "Tell me about a time when a store or restaurant was much more crowded than you expected.", "answer": "A few months ago, I went to a popular restaurant with a friend on a Saturday. We arrived before six and thought getting a table would be easy, but the place was absolutely packed. There were around twenty groups waiting, and the staff said the wait would be at least an hour and a half. We considered waiting, but after twenty minutes we were way too hungry. So we found a small restaurant nearby. Surprisingly, the food was excellent. Since then, I usually make a reservation when I go somewhere popular on the weekend.", "ko": "주말 인기 식당에 갔는데 예상보다 훨씬 붐벼 1시간 반 대기 안내를 받은 경험입니다. 다른 식당으로 이동한 뒤 이후 예약 습관이 생겼다고 말합니다.", "set": 8, "q": 1, "role": "정보·상황 파악"}, {"category": "돌발·롤플레이", "num": 23, "title": "Long hospital wait", "question": "Tell me about a time when you had to wait for a long time.", "answer": "I once had to wait almost two hours at a hospital even though I had an appointment. The waiting room was completely full because there had been several emergency cases that morning. At first, I was frustrated because I had other plans, but once I learned the reason, I understood the situation better. I listened to music and checked messages while I waited. Eventually, the doctor called my name and apologized. It wasn't pleasant, but it reminded me that unexpected things can happen even when you plan ahead.", "ko": "예약이 있었는데 응급환자들 때문에 병원에서 거의 두 시간 기다린 경험입니다. 이유를 알고 이해하게 되었고 예기치 않은 상황의 가능성을 느꼈다고 말합니다.", "set": 8, "q": 2, "role": "문제 해결·요청"}, {"category": "돌발·롤플레이", "num": 24, "title": "Hotel reservation missing", "question": "Tell me about a problem you had while traveling.", "answer": "During a trip a few years ago, I arrived at my hotel late at night, but the front desk couldn't find my reservation. I showed them the confirmation email, and it turned out there had been a problem between the booking website and the hotel's system. The room type I had booked was already sold out, and I was exhausted. Luckily, the hotel upgraded me to a larger room at no extra cost. It took about forty minutes to sort out, but in the end I got a better room. Now I always save screenshots of reservation confirmations before traveling.", "ko": "여행 중 호텔 예약 정보가 시스템에 없어 곤란했던 경험입니다. 확인 메일을 보여 문제를 해결했고 무료 업그레이드를 받았으며 이후 예약 화면을 캡처합니다.", "set": 8, "q": 3, "role": "관련 과거 경험"}, {"category": "돌발·롤플레이", "num": 25, "title": "Salon fully booked", "question": "Your regular hair salon is fully booked. Call and ask about your options.", "answer": "Hi, I'd like to make an appointment for a haircut this week. I usually go to Alex, but I saw there are no openings with him. Do you have any cancellations on Thursday or Friday? If Alex isn't available, is there another stylist who is experienced with short men's hairstyles? How much does a regular haircut cost, and how long does it usually take? I have an event this weekend, so I'd really like to get it done before Saturday. If there's a cancellation, could you give me a call?", "ko": "단골 미용사가 예약 마감이라 취소 자리, 다른 남성 커트 경험 디자이너, 가격과 소요시간을 묻고 취소 발생 시 연락을 요청합니다.", "set": 9, "q": 1, "role": "정보·상황 파악"}, {"category": "돌발·롤플레이", "num": 26, "title": "Noisy hotel room", "question": "The guests next to your hotel room are very noisy. Call the front desk and explain the situation.", "answer": "Hi, I'm calling from room 512. The room next to mine has been extremely noisy for the past hour. There seems to be a group talking loudly and playing music. Normally I wouldn't mind too much, but it's almost midnight and I have to get up early tomorrow. I tried using headphones, but the noise is still pretty loud. Would you mind contacting the guests and asking them to keep it down? If the problem continues, would it be possible to move me to another room? I don't want to cause trouble. I just really need some sleep.", "ko": "호텔 옆방이 자정 가까이까지 시끄러운 상황입니다. 프런트에 조용히 해달라고 요청하고 계속될 경우 객실 이동 가능 여부를 묻습니다.", "set": 9, "q": 2, "role": "문제 해결·요청"}, {"category": "돌발·롤플레이", "num": 27, "title": "Travel package inquiry", "question": "Call a travel agency and ask about a package tour.", "answer": "Hi, I'm interested in your three-night Tokyo package next month. Could you tell me exactly what's included in the price? Are the flights and hotel included? What about transportation from the airport to the hotel? I'd also like to know what kind of hotel it is, whether breakfast is included, and if there are any guided tours. I'm traveling alone, so is there an extra charge for a single room? And what is your cancellation policy? My vacation schedule isn't final yet, so I'd like to know how late I can cancel without a fee.", "ko": "도쿄 3박 패키지의 항공·호텔·공항 이동·조식·가이드 투어 포함 여부와 1인 추가요금, 취소 규정을 문의합니다.", "set": 9, "q": 3, "role": "관련 과거 경험"}, {"category": "돌발·롤플레이", "num": 28, "title": "Wrong cafe branch", "question": "Tell me about a time when you accidentally went to the wrong place.", "answer": "I once went to the wrong branch of a cafe when meeting a friend. He texted me the cafe name, so I searched it on a map app and followed the directions. When I arrived, I told him I was there, and he asked, 'Which location?' That's when I realized the cafe had several branches. The correct one was about twenty minutes away. I felt pretty stupid, but I apologized and took a taxi there. Ever since then, I always double-check the exact address before meeting someone.", "ko": "친구와 만나기로 한 카페의 다른 지점에 잘못 간 경험입니다. 이후 약속 장소의 정확한 주소를 확인하는 습관이 생겼습니다.", "set": 10, "q": 1, "role": "정보·상황 파악"}, {"category": "돌발·롤플레이", "num": 29, "title": "Lost wallet", "question": "Tell me about a time when you lost something important.", "answer": "I once lost my wallet while I was out with friends. I didn't notice until I tried to pay at a convenience store. I checked my pockets and bag several times, but it was gone. My cards, ID, and some cash were all inside, so I started to panic. I retraced my steps and went back to the restaurant we'd visited earlier. Luckily, someone had found it under the table and given it to an employee. Everything was still inside. Since then, I always keep my wallet in the same zipped pocket.", "ko": "친구들과 외출 중 지갑을 잃어버렸지만 이전 식당에서 누군가 맡겨두어 되찾은 경험입니다. 이후 항상 같은 지퍼 주머니에 보관합니다.", "set": 10, "q": 2, "role": "문제 해결·요청"}, {"category": "돌발·롤플레이", "num": 30, "title": "Ticket won't scan", "question": "Your ticket does not scan at the entrance to an event. Talk to a staff member and ask for help.", "answer": "Excuse me. I'm having a problem with my ticket. I bought it online about two weeks ago, but the QR code isn't scanning. I've increased the brightness on my phone and reopened the ticket, but it still doesn't work. I have the confirmation email and payment receipt right here. Could you check whether the ticket is valid? The event starts in about fifteen minutes. If the QR code is the problem, is there another way to verify my purchase? Could you issue a paper ticket or a new digital ticket? I can show you my ID if necessary.", "ko": "행사 입구에서 QR 티켓이 인식되지 않습니다. 결제 및 확인 자료를 제시하고 구매 확인, 종이 또는 새 디지털 티켓 발급을 요청합니다.", "set": 10, "q": 3, "role": "관련 과거 경험"}, {"category": "집", "set": 1, "q": 1, "role": "현재·일반 묘사", "title": "My home — Current", "question": "Describe my apartment. What is it like, and what do you usually do or notice about it?", "answer": "Well, when I think about my apartment, the first thing that comes to mind is a quiet, practical place with good storage and warm lighting. What I like about it is that it fits naturally into my daily life instead of requiring a lot of effort. I pay attention to practical things like convenience, comfort, timing, and how easy something is to manage. Another reason it works for me is that I can adjust it depending on my schedule or the situation. I would not say it is perfect, but it is reliable and familiar, and that matters a lot to me. Overall, my apartment is a fairly ordinary part of my life, but it has a bigger effect on my routine and mood than I used to realize.", "ko": "my apartment에 대해 생각하면 가장 먼저 떠오르는 점은 a quiet, practical place with good storage and warm lighting입니다. 일상에 무리 없이 잘 맞고 편리함과 편안함, 관리의 쉬움 같은 실용적인 부분이 좋습니다. 상황이나 일정에 따라 조정할 수 있다는 점도 장점입니다. 완벽하지는 않지만 익숙하고 안정적이라 제 일상과 기분에 생각보다 큰 영향을 줍니다."}, {"category": "집", "set": 1, "q": 2, "role": "과거·기억 경험", "title": "My home — Past", "question": "Tell me about a memorable past experience related to my apartment. What happened, and why do you remember it?", "answer": "One experience that immediately comes to mind is moving into it for the first time. It happened a while ago, and I remember it clearly because the situation felt a little different from my normal routine. At first, I did not expect it to be especially memorable, but as the day went on, I started to enjoy the small details. I had enough time to pay attention to what was happening instead of rushing through everything. Looking back, that experience changed the way I think about my apartment. Since then, I have tried to keep the parts that worked well and avoid overplanning. It was not a dramatic event, but it was exactly the kind of experience that stays with you because it felt natural and satisfying.", "ko": "가장 기억에 남는 경험 중 하나는 moving into it for the first time입니다. 평소와 조금 다른 상황이라 기억에 남았고, 처음에는 특별할 거라고 생각하지 않았지만 시간이 지나면서 작은 부분까지 즐길 수 있었습니다. 그 경험 이후 my apartment에 대한 생각도 조금 달라졌고, 잘됐던 부분은 유지하고 너무 빡빡하게 계획하지 않으려고 합니다."}, {"category": "집", "set": 1, "q": 3, "role": "문제·해결 경험", "title": "My home — Problem", "question": "Tell me about a problem or difficult situation you had related to my apartment. What happened, and how did you solve it?", "answer": "Actually, I had a problem related to my apartment once. The air conditioner stopped working during a heat wave. At first, I was pretty frustrated because it happened at an inconvenient time, and for a moment I was not sure what the best option was. Instead of panicking, I checked what I could do immediately and tried the simplest solution first. In the end, I called maintenance, used a fan for the night, and had it repaired the next morning. Fortunately, the situation was resolved without becoming a much bigger problem. What I learned from that experience is that it helps to stay calm, explain the situation clearly, and have a backup plan. Ever since then, I have been a little more prepared when something similar could happen.", "ko": "my apartment와 관련해 문제가 있었던 적이 있습니다. the air conditioner stopped working during a heat wave. 처음에는 당황했지만 가장 간단한 방법부터 차분히 확인했습니다. 결국 I called maintenance, used a fan for the night, and had it repaired the next morning. 큰 문제로 번지기 전에 해결됐고, 그 이후에는 비슷한 상황에 대비해 조금 더 준비하는 편입니다."}, {"category": "집", "set": 2, "q": 1, "role": "현재·일반 묘사", "title": "Favorite room — Current", "question": "Describe my b document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');Object.values(pages).forEach(x=>x.classList.add('hidden'));pages[b.dataset.page].classList.remove('hidden');if(b.dataset.page==='single')renderSingle();if(b.dataset.page==='vocab')renderVocab();if(b.dataset.page==='fav')renderFav();});

function cur(){return DATA.find(x=>x.category===cat&&x.set===setNo&&x.q===qNo)}function render(){const x=cur();if(!x)return;document.querySelectorAll('#qchips button').forEach(b=>b.classList.toggle('on',+b.dataset.q===qNo));$('setBadge').textContent=`${cat} · SET ${setNo} · Q${qNo}`;$('roleBadge').textContent=x.role;$('question').textContent=x.question;$('answer').textContent=x.answer;$('korean').textContent=x.ko;$('prog').style.width=(qNo/3*100)+'%';$('setdesc').textContent=qNo===1?'Q1 현재/일반 묘사':qNo===2?'Q2 과거 경험·비교/변화':'Q3 문제 발생 + 해결';$('favBtn').textContent=isFav(x)?'★ 즐겨찾기':'☆ 즐겨찾기';localStorage.setItem('opic_pos',JSON.stringify({cat,setNo,qNo}));}

function voices(){const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.startsWith('en'));$('voice').innerHTML=vs.map((v,i)=>`<option value="${i}">${v.name} (${v.lang})</option>`).join('');voice=vs[0]||null;$('voice').onchange=e=>voice=vs[+e.target.value]||null}speechSynthesis.onvoiceschanged=voices;voices();$('rate').oninput=e=>{rate=+e.target.value;$('rateLabel').textContent=rate.toFixed(2)+'x'};function speak(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate;if(voice)u.voice=voice;speechSynthesis.speak(u)}$('playQ').onclick=()=>speak(cur().question);$('playA').onclick=()=>speak(cur().answer);$('stop').onclick=()=>speechSynthesis.cancel();
function key(x){return `${x.category}|${x.set}|${x.q}`}function favs(){return JSON.parse(localStorage.getItem('opic_favs')||'[]')}function isFav(x){return favs().includes(key(x))}$('favBtn').onclick=()=>{const x=cur(),k=key(x),a=favs(),i=a.indexOf(k);if(i>=0)a.splice(i,1);else a.push(k);localStorage.setItem('opic_favs',JSON.stringify(a));render()};
function renderSingle(){const s=$('search').value.toLowerCase();const a=DATA.filter(x=>(x.category+' '+x.title+' '+x.question).toLowerCase().includes(s)).slice(0,80);$('singleList').innerHTML=a.map(x=>`<div class="vcard"><div class="vexp">${x.category} SET ${x.set} Q${x.q} · ${x.role}</div><div class="vmean">${x.question}</div><div class="vex">${x.answer.slice(0,170)}...</div><button class="btn" style="margin-top:8px" onclick="go('${x.category}',${x.set},${x.q})">세트에서 보기</button></div>`).join('')} $('search').oninput=renderSingle;window.go=(c,s,q)=>{cat=c;setNo=s;qNo=q;$('cat').value=c;document.querySelector('[data-page=set]').click();renderSetButtons();render();scrollTo(0,0)};
let vp=0;function renderVocab(){const cats=['전체',...new Set(VOCAB.map(v=>v.category))];if(!$('vcat').options.length)$('vcat').innerHTML=cats.map(c=>`<option>${c}</option>`).join('');const s=$('vsearch').value.toLowerCase(),c=$('vcat').value||'전체';const a=VOCAB.filter(v=>(c==='전체'||v.category===c)&&((v.expression+' '+v.meaning+' '+v.example).toLowerCase().includes(s)));$('vcount').textContent=`${a.length.toLocaleString()}개`;const p=a.slice(vp*40,vp*40+40);$('vlist').innerHTML=p.map(v=>`<div class="vcard"><div class="vexp">${v.expression}</div><div class="vmean">${v.meaning}</div><div class="vex">${v.example}</div><button class="btn" style="margin-top:8px" onclick='speak(${JSON.stringify("__X__")})'>🔊 발음</button></div>`.replace('"__X__"',JSON.stringify(v.expression+'. '+v.example))).join('')}$('vsearch').oninput=()=>{vp=0;renderVocab()};$('vcat').onchange=()=>{vp=0;renderVocab()};$('vprev').onclick=()=>{vp=Math.max(0,vp-1);renderVocab()};$('vnext').onclick=()=>{vp++;renderVocab()};
function renderFav(){const ks=favs(),a=DATA.filter(x=>ks.includes(key(x)));$('favList').innerHTML=a.length?a.map(x=>`<div class="vcard"><div class="vexp">${x.category} SET ${x.set} Q${x.q}</div><div class="vmean">${x.question}</div><button class="btn" style="margin-top:8px" onclick="go('${x.category}',${x.set},${x.q})">열기</button></div>`).join(''):'<div class="mini">아직 즐겨찾기가 없습니다.</div>'}
